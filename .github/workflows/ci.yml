# CI — harness の Python テストスイート
# agent-quality.yml の workflow_run trigger (workflows: ["CI"]) がこの name を参照する。
# KEEP IN SYNC: name を変える場合は agent-quality.yml 側も更新すること。
name: "CI"

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  harness-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: false
      - name: Repo harness script tests
        run: uvx pytest scripts/tests/ -q
      - name: Claude scripts tests
        working-directory: .config/claude/scripts
        run: uvx pytest tests/ -q
      - name: imozuru skill script tests
        run: uvx pytest .config/claude/skills/imozuru/scripts/tests/ -q
      - name: Root harness tests
        run: uvx pytest tests/ -q

  claude-hooks-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # stable
        with:
          toolchain: stable
      - name: cargo test
        working-directory: tools/claude-hooks
        run: cargo test --locked

  # lefthook pre-commit だけだと hook 未設定の commit が PUBLIC repo に通る。
  # biome / oxlint などの整形はここには入れない。
  publicity-and-config:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # 既定の fetch-depth: 1 では origin/master も merge-base も取れず
          # origin/master...HEAD が解けない。0 は全 branch の全履歴を取る。
          fetch-depth: 0

      - name: Publicity scan (PR diff)
        run: |
          git rev-parse --verify origin/master
          python3 scripts/security/publicity-scan.py origin/master...HEAD

      - name: Company content guard (PR diff)
        run: bash scripts/security/check-company-content.sh origin/master...HEAD

      # validate-symlinks は HOME の managed symlink が要るので回さない。
      - name: Validate configs
        run: .bin/validate_configs.sh

      - name: Validate readmes
        run: .bin/validate_readmes.sh
